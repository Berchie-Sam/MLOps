deployments:
  - name: nyc-taxi-duration-prediction-experiment
    entrypoint: Orchestrate.py:main_flow
    platform: prefect
    environment:
      python: python:3.9.13
    run_config:
      work_pool:
        name: zoompool
  - name: nyc-taxi-duration-prediction-s3-experiment
    entrypoint: Orchestrate_s3.py:main_flow_s3
    platform: prefect
    environment:
      python: python:3.9.13
    run_config:
      work_pool:
        name: zoompool
